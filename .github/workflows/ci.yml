name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dub:
    name: DUB (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd
          - ldc

    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: latest
      - name: Test default configuration
        env:
          DFLAGS: -de
        run: dub test --config=default --build=unittest
      - name: Test colorized configuration
        env:
          DFLAGS: -de
        run: dub test --config=colorized --build=unittest
      - name: Test documented public API
        env:
          DFLAGS: -de
        run: dub run --root=tests --build=debug
      - name: ThreadSanitizer
        if: matrix.compiler == 'ldc'
        run: |
          ldc2 -de -i -I=source -fsanitize=thread \
            tests/multi_logger_race.d -of=dlogg-test-tsan
          ./dlogg-test-tsan

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --print-build-logs
