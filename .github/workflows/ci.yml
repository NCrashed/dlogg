name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dub:
    name: DUB (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd
          - ldc

    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: latest
      - name: Test default configuration
        env:
          DFLAGS: -de
        run: dub test --config=default --build=unittest
      - name: Test colorized configuration
        env:
          DFLAGS: -de
        run: dub test --config=colorized --build=unittest

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --print-build-logs
